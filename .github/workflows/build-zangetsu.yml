name: Build Zangetsu (NetShare patch)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Stage 1 of checkout: the fork's default branch holds the bundle files
      # (patches, stub AAR, CI lockfile, gradle wrapper, this workflow).
      - name: Checkout fork default branch (bundle files live here)
        uses: actions/checkout@v4

      # Stage 2: move the SOURCE TREE to the exact upstream commit the
      # patches target. The bundle files are untracked in that tree and
      # upstream has no files with these names, so they survive the switch.
      - name: Pin source tree to upstream commit b7f9f78f
        run: |
          git fetch --depth=1 origin b7f9f78f352a839c91d32e8335b0e1b491ec484f
          git checkout --detach FETCH_HEAD
          for f in zangetsu-netshare-support-full.patch zangetsu-build-enable.patch \
                   discord_partner_sdk-stub.aar pubspec.lock.ci gradle-wrapper.zip; do
            test -f "$f" || { echo "MISSING BUNDLE FILE: $f"; exit 1; }
          done
          git log -1 --oneline

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter 3.47.9
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Apply patches
        run: |
          git apply zangetsu-netshare-support-full.patch
          git apply zangetsu-build-enable.patch
          # Known-good dependency lock, resolved with Flutter 3.47.9.
          cp pubspec.lock.ci pubspec.lock
          # Discord Social SDK is not publicly redistributable; a compile-only
          # stub takes its place (Rich Presence is disabled in this build).
          mkdir -p android/discord-sdk
          cp discord_partner_sdk-stub.aar android/discord-sdk/discord_partner_sdk.aar
          # The repo does not track the Gradle wrapper; restore it.
          unzip -o gradle-wrapper.zip -d android
          chmod +x android/gradlew

      - name: Tune Gradle for the CI runner
        run: |
          printf '\norg.gradle.workers.max=2\nkotlin.compiler.execution.strategy=in-process\n' >> android/gradle.properties

      - name: Build release APK
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zangetsu-netshare-apk
          path: build/app/outputs/flutter-apk/app-release.apk
